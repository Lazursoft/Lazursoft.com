version: 1
env:
  variables:
    DART_SASS_VERSION: 1.104.0
    HUGO_VERSION: 0.166.0
    TZ: Asia/Seoul
    HUGO_CACHEDIR: ${PWD}/.cache/hugo
frontend:
  phases:
    preBuild:
      commands:
        - curl -sfL -o /tmp/hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
        - tar -C /tmp -xzf /tmp/hugo.tar.gz hugo
        - chmod +x /tmp/hugo
        - /tmp/hugo version
        - curl -sfL -o /tmp/sass.tar.gz "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
        - tar -C /tmp -xzf /tmp/sass.tar.gz
        - export PATH="/tmp/dart-sass:${PATH}"
        - sass --version
        - git config --global core.quotepath false
        - if [[ $(git rev-parse --is-shallow-repository) == true ]]; then git fetch --unshallow; fi
        - if [[ -f .gitmodules ]]; then git submodule update --init --recursive; fi
        - if [[ -f package-lock.json ]]; then npm ci; fi
    build:
      commands:
        - PATH="/tmp/dart-sass:${PATH}" /tmp/hugo build --gc --minify
  artifacts:
    baseDirectory: public
    files:
      - "**/*"
  cache:
    paths:
      - .cache/hugo/**/*

